<!DOCTYPE html>
<html lang="es">

<head>
    <script>
        if (!sessionStorage.getItem('at_logged')) {
            window.location.replace('inicio.html');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Traveler</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div id="universe"></div>

    <header>
        <nav>
            <div class="logo">
                <a href="index.html">
                    <h1>Audio Traveler</h1>
                </a>
            </div>
            <div class="nav-links">
                <span id="nombreUsuarioNav"
                    style="color: var(--accent); font-weight: 600; font-family: var(--font-display); margin-right: 15px; letter-spacing: 0.5px;"></span>
                <a href="favoritos.html" class="btn-nav">Favoritos</a>
                <a href="historial.html" class="btn-nav">Historial</a>
                <a href="#" class="btn-nav" id="btnNavAmigos">Amigos</a>
                <a href="index.html" class="btn-cerrar">Cerrar Sesión</a>
                <div class="jam-dropdown-wrapper">
                    <button class="btn-jam-nav" id="btnAbrirJam">
                        <i class="fas fa-headphones"></i> Unirse a Jam
                    </button>
                    <div class="jam-dropdown" id="dropdownJam">
                        <p class="jam-dropdown-title"><i class="fas fa-door-open"></i> Unirse a una Jam</p>
                        <input class="jam-dropdown-input" type="text" id="inputCodigoJam" placeholder="Código de sala"
                            maxlength="6">
                        <button class="jam-dropdown-btn" id="btnUnirse" disabled>Entrar</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="barra-busqueda-wrapper" style="position:relative; width:min(440px, 95vw); margin:0 auto 24px;">
            <div class="barra-busqueda" style="margin:0;">
                <i class="fas fa-magnifying-glass" id="iconoBusqueda"></i>
                <input type="text" id="inputBusqueda" placeholder="Buscar ciudad, país o estación" autocomplete="off">
                <i class="fas fa-xmark" id="btnLimpiarBusqueda"
                    style="cursor:pointer; display:none; color:var(--text-muted); transition:var(--transition);"></i>
            </div>
            <div id="resultadosBusqueda"
                style="display:none; position:absolute; top:calc(100% + 8px); left:0; right:0; background:var(--bg-glass); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid rgba(90,26,138,0.6); border-radius:16px; overflow:hidden; box-shadow:0 8px 32px rgba(0,0,0,0.4); z-index:1000; max-height:340px; overflow-y:auto;">
            </div>
        </div>

        <section class="globo-seccion">
            <div id="globo-canvas"></div>
            <div style="display: flex; gap: 20px; align-items: center; margin-top: -5px;">
                <p class="globo-hint"><i class="fas fa-hand-pointer"></i> Haz clic en un país para ver sus emisoras</p>
                <button id="btnFijarGlobo"
                    style="background: transparent; border: 1px solid var(--purple-border); color: var(--text-secondary); padding: 4px 12px; border-radius: 20px; cursor: pointer; font-family: var(--font-body); font-size: 12px; transition: var(--transition);">
                    <i class="fas fa-unlock"></i> Rotación Activa
                </button>
            </div>
        </section>

        <div class="panel-emisoras" id="panel-emisoras">
            <div class="panel-header">
                <h3 id="panel-pais">Emisoras</h3>
                <button id="panel-cerrar"
                    style="background:transparent;border:none;color:var(--text-secondary);font-size:22px;cursor:pointer;padding:4px 8px;line-height:1;"><i
                        class="fas fa-xmark"></i></button>
            </div>
            <div class="panel-loader" id="panel-loader" style="flex-shrink:0;">
                <i class="fas fa-spinner fa-spin"></i><span>Cargando emisoras...</span>
            </div>
            <div class="lista-emisoras" id="panel-lista"></div>
        </div>

        <div class="iconos-lateral">
            <button class="icono-btn" title="Compartir"><i class="fas fa-share-nodes"></i></button>
            <button class="icono-btn" title="Enviar"><i class="fas fa-paper-plane"></i></button>
            <button class="icono-btn" title="Aleatoria"><i class="fas fa-dice"></i></button>
        </div>

        <section class="reproductor">
            <div class="reproductor-info">
                <h3 class="estacion-nombre" id="rep-nombre">Selecciona una emisora</h3>
                <p class="estacion-lugar" id="rep-lugar">Haz clic en un país del globo</p>
            </div>
            <div class="reproductor-acciones">
                <button class="icono-btn" title="Favorito"><i class="fas fa-heart"></i></button>
                <a href="jam.html"><button class="icono-btn" title="Jam"><i class="fas fa-user-group"></i></button></a>
            </div>
            <div class="reproductor-controles">
                <button class="control-btn"><i class="fas fa-backward-step"></i></button>
                <button class="control-btn" id="rep-playpause"><i class="fas fa-play"></i></button>
                <button class="control-btn"><i class="fas fa-forward-step"></i></button>
            </div>
            <div class="reproductor-volumen">
                <i class="fas fa-volume-high"></i>
                <input type="range" min="0" max="100" value="70" id="rep-volumen">
            </div>
        </section>

        <div class="panel-historial" id="panelHistorial">
            <div class="panel-header">
                <h3>Historial</h3>
                <button class="btn-cerrar-panel" id="cerrarHistorial"
                    style="background:transparent;border:none;color:var(--text-secondary);font-size:22px;cursor:pointer;padding:4px 8px;line-height:1;"><i
                        class="fas fa-xmark"></i></button>
            </div>
            <div id="listaHistorialItems" style="display:flex;flex-direction:column;gap:10px;"></div>
        </div>

        <div class="panel-amigos" id="panelAmigos">
            <div class="panel-header">
                <h3>Amigos</h3>
                <button class="btn-cerrar-panel" id="cerrarAmigos"
                    style="background:transparent;border:none;color:var(--text-secondary);font-size:22px;cursor:pointer;padding:4px 8px;line-height:1;"><i
                        class="fas fa-xmark"></i></button>
            </div>
            <div class="panel-amigos-subheader">
                <div class="buscador-amigos">
                    <i class="fas fa-magnifying-glass"></i>
                    <input type="text" id="inputBuscarAmigo" placeholder="Buscar nuevos amigos...">
                </div>
                <div id="resultadosBusquedaAmigos"
                    style="display:none;flex-direction:column;gap:8px;margin-bottom:12px;"></div>
                <h4
                    style="color:var(--text-muted);font-size:11px;text-transform:uppercase;margin:10px 0 6px;letter-spacing:1px;">
                    Mi Lista</h4>
            </div>
            <div class="lista-amigos" id="listaAmigos"></div>
        </div>
    </main>

    <div class="modal-overlay" id="customModal">
        <div class="modal-caja">
            <h3 class="modal-titulo" id="modalTitulo">Aviso</h3>
            <p class="modal-texto" id="modalTexto">Mensaje</p>
            <div class="modal-botones">
                <button class="btn-modal btn-modal-cancel" id="modalBtnCancel" style="display:none;">Rechazar</button>
                <button class="btn-modal btn-modal-ok" id="modalBtnOk">Aceptar</button>
            </div>
        </div>
    </div>

    <script src="estrellas.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
    <script src="globo.js"></script>

    <script>
        // ── HISTORIAL Y FAVORITOS DIRECTOS A BD ──
        const panelHistorial = document.getElementById('panelHistorial');
        const contenedorHistorial = document.getElementById('listaHistorialItems');

        // ── HISTORIAL Y FAVORITOS (VERSIÓN ANTI-CACHÉ) ──
        document.querySelector('a[href="historial.html"]').addEventListener('click', async function (e) {
            e.preventDefault();
            const panelHistorial = document.getElementById('panelHistorial');
            const contenedor = document.getElementById('listaHistorialItems');

            panelHistorial.classList.toggle('abierto');

            if (panelHistorial.classList.contains('abierto')) {
                contenedor.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:12px; margin-top:20px;"><i class="fas fa-spinner fa-spin"></i> Cargando...</p>';
                try {
                    // Sello de tiempo para forzar al navegador a descargar datos nuevos
                    const ts = Date.now();

                    const [resHist, resFav] = await Promise.all([
                        fetch(`backend/historial.php?accion=cargar&_t=${ts}`, { cache: 'no-store', credentials: 'include' }).then(r => r.json()).catch(() => ({ ok: false })),
                        fetch(`backend/favoritos.php?accion=cargar&_t=${ts}`, { cache: 'no-store', credentials: 'include' }).then(r => r.json()).catch(() => ({ ok: false }))
                    ]);

                    if (resHist.ok) {
                        contenedor.innerHTML = '';
                        const historial = resHist.historial || [];
                        const favoritos = resFav.ok && resFav.favoritos ? resFav.favoritos : [];

                        if (historial.length === 0) {
                            contenedor.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:20px;">Sin actividad reciente.</p>';
                            return;
                        }

                        // Agrupar por día
                        const grupos = {};
                        historial.forEach(item => {
                            const fecha = new Date(item.FechaEscucha);
                            const hoy = new Date();
                            const ayer = new Date();
                            ayer.setDate(hoy.getDate() - 1);

                            let etiqueta;
                            if (fecha.toDateString() === hoy.toDateString()) {
                                etiqueta = "Hoy";
                            } else if (fecha.toDateString() === ayer.toDateString()) {
                                etiqueta = "Ayer";
                            } else {
                                etiqueta = fecha.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
                                etiqueta = etiqueta.charAt(0).toUpperCase() + etiqueta.slice(1);
                            }

                            if (!grupos[etiqueta]) grupos[etiqueta] = [];
                            grupos[etiqueta].push(item);
                        });

                        // Renderizar por grupo
                        Object.entries(grupos).forEach(([dia, items]) => {
                            // Encabezado del día
                            const header = document.createElement('p');
                            header.textContent = dia;
                            header.style.cssText = 'color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:1px; margin:14px 0 6px; font-weight:600;';
                            contenedor.appendChild(header);

                            items.forEach(item => {
                                const nombre = item.Nombre || "Estación";
                                const url = item.Stream_url || "";
                                const ciudad = item.Ciudad || "Internacional";
                                const esFav = favoritos.some(f => f.Stream_url === url);
                                const heartStyle = esFav ? 'color: var(--accent); opacity: 1;' : 'color: rgba(255,255,255,0.2); opacity: 0.5;';

                                const div = document.createElement('div');
                                div.className = 'lista-item';
                                div.innerHTML = `
            <div class="lista-info">
                <i class="fas fa-radio" style="color:var(--accent);"></i>
                <div>
                    <h3 style="font-size:14px; font-weight:600;">${nombre}</h3>
                    <p style="font-size:11px; color:var(--text-muted);">${ciudad}</p>
                </div>
            </div>
            <div class="lista-acciones" style="display:flex; align-items:center; gap:12px;">
                <i class="fas fa-heart" style="${heartStyle} font-size:16px;"></i>
                <button class="control-btn play-historial" data-url="${url}" data-nombre="${nombre}" data-lugar="${ciudad}"><i class="fas fa-play"></i></button>
            </div>
        `;
                                contenedor.appendChild(div);
                            });
                        });
                        document.querySelectorAll('.play-historial').forEach(btn => {
                            btn.addEventListener('click', function (ev) {
                                ev.stopPropagation();

                                // Resetear TODOS los botones del historial a play
                                document.querySelectorAll('.play-historial').forEach(b => {
                                    b.innerHTML = '<i class="fas fa-play"></i>';
                                    b.style.background = '';
                                });

                                const url = this.dataset.url;
                                const nombre = this.dataset.nombre;
                                const lugar = this.dataset.lugar;
                                const self = this;

                                if (typeof window._reproducirGlobo === 'function') {
                                    window._reproducirGlobo(url, nombre, lugar, document.getElementById('rep-playpause'));
                                } else {
                                    // Fallback directo si globo.js no está listo
                                    if (window._audGlobo) {
                                        window._audGlobo.src = url;
                                        window._audGlobo.play().catch(() => { });
                                    }
                                    const elNombre = document.getElementById('rep-nombre');
                                    const elLugar = document.getElementById('rep-lugar');
                                    const elBtn = document.getElementById('rep-playpause');
                                    if (elNombre) elNombre.textContent = nombre;
                                    if (elLugar) elLugar.textContent = lugar;
                                    if (elBtn) elBtn.innerHTML = '<i class="fas fa-pause"></i>';
                                    window.estacionActualData = { nombre, url, lugar };
                                }

                                // Marcar este botón como "reproduciendo"
                                self.innerHTML = '<i class="fas fa-pause"></i>';
                                self.style.background = 'rgba(28,240,12,0.2)';


                            });
                        });
                    }
                } catch (err) {
                    contenedor.innerHTML = '<p style="color:red; text-align:center;">Error de conexión.</p>';
                }
            }
        });


        const usuarioLoggeado = sessionStorage.getItem('at_user');
        if (usuarioLoggeado) {
            document.getElementById('nombreUsuarioNav').textContent = '@' + usuarioLoggeado;
        }

        // ── DROPDOWN Y UNIRSE A JAM ──
        const btnAbrir = document.getElementById('btnAbrirJam');
        const dropdown = document.getElementById('dropdownJam');
        const inputCod = document.getElementById('inputCodigoJam');
        const btnEntrar = document.getElementById('btnUnirse');

        btnAbrir.addEventListener('click', e => {
            e.stopPropagation();
            dropdown.classList.toggle('abierto');
            if (dropdown.classList.contains('abierto')) inputCod.focus();
        });
        document.addEventListener('click', e => {
            if (!dropdown.contains(e.target) && e.target !== btnAbrir) dropdown.classList.remove('abierto');
        });
        inputCod.addEventListener('input', () => btnEntrar.disabled = inputCod.value.trim().length !== 6);

        btnEntrar.addEventListener('click', async () => {
            const codigo = inputCod.value.trim().toUpperCase();
            if (codigo.length === 6) {
                const iconoOriginal = btnEntrar.innerHTML;
                btnEntrar.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                try {
                    const res = await fetch('backend/jam.php?accion=unirse', { credentials: 'include',
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ codigo })
                    });
                    const data = await res.json();
                    if (data.ok) {
                        sessionStorage.setItem('jam_estacion_nombre', data.estacion);
                        sessionStorage.setItem('jam_estacion_url', data.stream_url);
                        sessionStorage.setItem('jam_codigo', codigo);
                        sessionStorage.setItem('jam_id', data.idJam || data.id || data.IdJam || codigo);
                        sessionStorage.setItem('jam_estacion_lugar', 'Internacional');
                        sessionStorage.setItem('jam_rol', 'Invitado');
                        window.location.href = 'jam.html';
                    } else {
                        alert(data.mensaje);
                        btnEntrar.innerHTML = iconoOriginal;
                    }
                } catch (err) {
                    alert("Error al conectar con la Jam.");
                    btnEntrar.innerHTML = iconoOriginal;
                }
            }
        });

        // ── SISTEMA DE AMIGOS CON BASE DE DATOS ──
        const inputBuscarAmigo = document.getElementById('inputBuscarAmigo');
        const cajaResultados = document.getElementById('resultadosBusquedaAmigos');
        const contenedorAmigos = document.getElementById('listaAmigos');

        document.getElementById('panelAmigos').addEventListener('transitionend', function (e) {
            if (this.classList.contains('abierto') && e.propertyName === 'right') cargarAmigos();
        });


        document.getElementById('btnNavAmigos').addEventListener('click', function (e) {
            e.preventDefault(); e.stopPropagation();
            document.getElementById('panelAmigos').classList.add('abierto');
        });

        document.addEventListener('click', function (e) {
            const panelAmigos = document.getElementById('panelAmigos');
            const btnEnviar = document.querySelector('.icono-btn[title="Enviar"]');
            const btnNavAmigos = document.getElementById('btnNavAmigos');
            const modalCustom = document.getElementById('customModal');

            if (panelAmigos && panelAmigos.classList.contains('abierto')) {
                if (!panelAmigos.contains(e.target) && (!btnEnviar || !btnEnviar.contains(e.target)) && (!btnNavAmigos || !btnNavAmigos.contains(e.target)) && (!modalCustom || !modalCustom.contains(e.target))) {
                    panelAmigos.classList.remove('abierto');
                }
            }
        });

        async function cargarAmigos() {
            contenedorAmigos.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:12px;">Cargando amigos...</p>';
            try {
                const res = await fetch('backend/amigos.php?accion=listar', { credentials: 'include' });
                const data = await res.json();
                contenedorAmigos.innerHTML = '';
                if (!data.ok) {
                    contenedorAmigos.innerHTML = '<p style="color:#ff4444; font-size:12px; text-align:center;">Sesión no válida. Por favor <a href=\"inicio.html\" style=\"color:var(--accent)\">inicia sesión</a>.</p>';
                    return;
                }
                if (data.amigos.length === 0) {
                    contenedorAmigos.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:13px;">No tienes amigos agregados aún.</p>';
                    return;
                }

                data.amigos.forEach(amigo => {
                    const item = document.createElement('div');
                    item.className = 'amigo-item';
                    item.innerHTML = `
                        <div class="lista-info">
                            <i class="fas fa-user-circle"></i>
                            <div>
                                <h3>@${amigo.AmigoNombre}</h3>
                                <p>Amigo</p>
                            </div>
                        </div>
                        <div class="lista-acciones">
                            <button class="control-btn btn-invitar-jam" data-nombre="${amigo.AmigoNombre}" title="Enviar Emisora / Invitar"><i class="fas fa-headphones"></i></button>
                            <button class="control-btn btn-eliminar-amigo" data-id="${amigo.IdAmigos}" title="Eliminar"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                    contenedorAmigos.appendChild(item);
                });

                document.querySelectorAll('.btn-invitar-jam').forEach(btn => {
                    btn.addEventListener('click', async function () {
                        const amigoNombre = this.dataset.nombre;
                        if (!window.estacionActualData) {
                            alert("Primero selecciona una emisora del globo terráqueo para enviarla.");
                            return;
                        }

                        this.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                        const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                        let codigo = '';
                        for (let i = 0; i < 6; i++) codigo += caracteres.charAt(Math.floor(Math.random() * caracteres.length));

                        try {
                            const resCrear = await fetch('backend/jam.php?accion=crear', { credentials: 'include',
                                method: 'POST',
                                body: JSON.stringify({
                                    codigo: codigo,
                                    streamUrl: window.estacionActualData.url,
                                    nombre: window.estacionActualData.nombre,
                                    lugar: window.estacionActualData.lugar
                                })
                            });
                            const dataCrear = await resCrear.json();

                            await fetch('backend/jam.php?accion=invitar', { credentials: 'include',
                                method: 'POST',
                                body: JSON.stringify({ codigo: codigo, amigo: amigoNombre })
                            });

                            sessionStorage.setItem('jam_estacion_nombre', window.estacionActualData.nombre);
                            sessionStorage.setItem('jam_estacion_url', window.estacionActualData.url);
                            sessionStorage.setItem('jam_codigo', codigo);
                            sessionStorage.setItem('jam_id', dataCrear.idJam || dataCrear.id || dataCrear.IdJam || codigo);
                            sessionStorage.setItem('jam_estacion_lugar', window.estacionActualData.lugar || 'Internacional');
                            sessionStorage.setItem('jam_rol', 'Host');

                            alert(`¡Invitación enviada a @${amigoNombre}! 🚀\n\nEntrando a la sala Jam...`);
                            window.location.href = 'jam.html';
                        } catch (err) {
                            alert("Error al enviar la invitación.");
                            this.innerHTML = '<i class="fas fa-headphones"></i>';
                        }
                    });
                });

                document.querySelectorAll('.btn-eliminar-amigo').forEach(btn => {
                    btn.addEventListener('click', async function () {
                        if (confirm('¿Seguro que quieres eliminar a este amigo?')) {
                            await fetch('backend/amigos.php?accion=eliminar', { credentials: 'include',
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ idAmigos: this.dataset.id })
                            });
                            cargarAmigos();
                        }
                    });
                });
            } catch (err) {
                contenedorAmigos.innerHTML = '<p style="color:#ff4444; font-size:12px;">Error de conexión.</p>';
            }
        }

        inputBuscarAmigo.addEventListener('input', async function () {
            const q = this.value.trim().replace('@', '');
            if (q.length < 2) { cajaResultados.style.display = 'none'; return; }
            const res = await fetch(`backend/amigos.php?accion=buscar&q=${encodeURIComponent(q)}`, { credentials: 'include' });
            const data = await res.json();
            cajaResultados.innerHTML = '';
            cajaResultados.style.display = 'flex';
            if (!data.ok || !data.resultados) { cajaResultados.style.display = 'none'; return; }
            if (data.resultados.length > 0) {
                data.resultados.forEach(u => {
                    cajaResultados.innerHTML += `
                        <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.06); padding:10px 14px; border-radius:10px; border:1px solid var(--purple-border);">
                            <span style="color:var(--text-primary); font-size:13px; font-weight:600;">@${u.Username}</span>
                            <button class="btn-agregar-amigo" data-id="${u.IdUsuario}" style="background:var(--accent); color:var(--bg-dark); border:none; padding:4px 12px; border-radius:12px; cursor:pointer; font-size:11px; font-weight:bold; transition:var(--transition);">Agregar</button>
                        </div>
                    `;
                });
                document.querySelectorAll('.btn-agregar-amigo').forEach(btn => {
                    btn.addEventListener('click', async function () {
                        await fetch('backend/amigos.php?accion=agregar', { credentials: 'include',
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ idAmigo: this.dataset.id })
                        });
                        inputBuscarAmigo.value = '';
                        cajaResultados.style.display = 'none';
                        cargarAmigos();
                    });
                });
            } else {
                cajaResultados.innerHTML = '<p style="color:var(--text-muted); font-size:12px; text-align:center;">No se encontraron usuarios.</p>';
            }
        });

        document.getElementById('rep-volumen').addEventListener('input', function () {
            if (window._audGlobo) window._audGlobo.volume = this.value / 100;
        });

        const modal = document.getElementById('customModal');
        const modalTit = document.getElementById('modalTitulo');
        const modalTxt = document.getElementById('modalTexto');
        const btnOk = document.getElementById('modalBtnOk');
        const btnCancel = document.getElementById('modalBtnCancel');

        window.alert = function (mensaje) {
            modalTit.textContent = "Audio Traveler";
            modalTxt.textContent = mensaje;
            btnCancel.style.display = "none";
            btnOk.textContent = "Entendido";
            modal.classList.add('activo');
            btnOk.onclick = () => modal.classList.remove('activo');
        };

        function mostrarConfirmacion(titulo, mensaje, onOk, onCancel) {
            modalTit.textContent = titulo;
            modalTxt.textContent = mensaje;
            btnCancel.style.display = "block";
            btnOk.textContent = "¡Unirme!";
            modal.classList.add('activo');

            // Temporizador de 1 minuto (60,000 ms) para auto-rechazar
            let timeout = setTimeout(() => {
                if (modal.classList.contains('activo')) {
                    modal.classList.remove('activo');
                    if (onCancel) onCancel(); // Rechaza automáticamente en la BD
                }
            }, 60000);

            btnOk.onclick = () => {
                clearTimeout(timeout); // Cancela el temporizador si da click
                modal.classList.remove('activo');
                onOk();
            };

            btnCancel.onclick = () => {
                clearTimeout(timeout); // Cancela el temporizador si da click
                modal.classList.remove('activo');
                if (onCancel) onCancel();
            };
        }

        const invitacionesYaMostradas = [];

        setInterval(async () => {
            try {
                const res = await fetch('backend/jam.php?accion=revisar', { credentials: 'include' });
                const data = await res.json();
                if (data.ok && data.invitacion) {
                    const inv = data.invitacion;
                    if (!invitacionesYaMostradas.includes(inv.IdInvitacion)) {
                        invitacionesYaMostradas.push(inv.IdInvitacion);
                        mostrarConfirmacion(
                            "¡Te invitaron a escuchar juntos! 🎧",
                            `@${inv.Remitente} te envió la emisora ${inv.Estacion}. ¿Quieres unirte a su sala?`,
                            async () => {
                                await fetch('backend/jam.php?accion=responder', { credentials: 'include',
                                    method: 'POST', body: JSON.stringify({ idInvitacion: inv.IdInvitacion, estado: 'Aceptada' })
                                });
                                const r = await fetch('backend/jam.php?accion=unirse', {
                                    credentials: 'include', method: 'POST', body: JSON.stringify({ codigo: inv.Codigo })
                                });
                                const d = await r.json();
                                if (d.ok) {
                                    sessionStorage.setItem('jam_estacion_nombre', d.estacion);
                                    sessionStorage.setItem('jam_estacion_url', d.stream_url);
                                    sessionStorage.setItem('jam_codigo', inv.Codigo);
                                    sessionStorage.setItem('jam_estacion_lugar', 'Internacional');
                                    sessionStorage.setItem('jam_rol', 'Invitado');
                                    window.location.href = 'jam.html';
                                }
                            },
                            async () => {
                                await fetch('backend/jam.php?accion=responder', { credentials: 'include',
                                    method: 'POST', body: JSON.stringify({ idInvitacion: inv.IdInvitacion, estado: 'Rechazada' })
                                });
                            }
                        );
                    }
                }
            } catch (e) { }
        }, 5000);

        (function () {
            const RADIO_API = 'https://de1.api.radio-browser.info/json';
            const inputBusqueda = document.getElementById('inputBusqueda');
            const cajaBusqueda = document.getElementById('resultadosBusqueda');
            const iconoBusq = document.getElementById('iconoBusqueda');
            const btnLimpiar = document.getElementById('btnLimpiarBusqueda');
            let timerBusqueda = null;
            let controladorBusqueda = null;

            function mostrarCarga() {
                cajaBusqueda.style.display = 'block';
                cajaBusqueda.innerHTML = `<div style="padding:20px; text-align:center; color:var(--text-muted); font-size:13px;"><i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i>Buscando emisoras...</div>`;
                iconoBusq.className = 'fas fa-spinner fa-spin'; iconoBusq.style.color = 'var(--accent)';
            }

            function ocultarResultados() {
                cajaBusqueda.style.display = 'none'; cajaBusqueda.innerHTML = '';
                iconoBusq.className = 'fas fa-magnifying-glass'; iconoBusq.style.color = '';
            }

            function renderizarResultados(estaciones) {
                iconoBusq.className = 'fas fa-magnifying-glass'; iconoBusq.style.color = '';
                if (!estaciones || estaciones.length === 0) {
                    cajaBusqueda.innerHTML = `<div style="padding:20px; text-align:center; color:var(--text-muted); font-size:13px;"><i class="fas fa-radio" style="display:block; font-size:22px; margin-bottom:8px; opacity:0.4;"></i>No se encontraron emisoras</div>`;
                    return;
                }

                cajaBusqueda.innerHTML = '';
                estaciones.slice(0, 12).forEach((st, i) => {
                    const item = document.createElement('div');
                    item.style.cssText = `display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; border-bottom:${i < Math.min(estaciones.length, 12) - 1 ? '1px solid rgba(90,26,138,0.25)' : 'none'}; transition:background 0.15s;`;
                    item.onmouseenter = () => item.style.background = 'rgba(255,255,255,0.06)';
                    item.onmouseleave = () => item.style.background = 'transparent';

                    const pais = st.country || 'Internacional'; const ciudad = st.state ? `${st.state}, ${pais}` : pais; const favicon = st.favicon;
                    item.innerHTML = `
                        <div style="width:34px; height:34px; border-radius:8px; background:rgba(90,26,138,0.3); border:1px solid rgba(90,26,138,0.4); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;">
                            ${favicon ? `<img src="${favicon}" style="width:100%;height:100%;object-fit:cover;border-radius:7px;" onerror="this.parentElement.innerHTML='<i class=\\'fas fa-radio\\' style=\\'font-size:14px;color:var(--accent);\\'></i>'">` : `<i class="fas fa-radio" style="font-size:14px; color:var(--accent);"></i>`}
                        </div>
                        <div style="flex:1; min-width:0;">
                            <div style="color:var(--text-primary); font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${st.name}</div>
                            <div style="color:var(--text-muted); font-size:11px; margin-top:2px;">${ciudad}</div>
                        </div>
                        <button style="background:var(--accent); border:none; color:var(--bg-dark); border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; font-size:11px; transition:var(--transition);" title="Reproducir"><i class="fas fa-play"></i></button>
                    `;

                    const btnPlay = item.querySelector('button');
                    const accionReproducir = () => {
                        if (window._audGlobo && st.url_resolved) {
                            if (typeof window._reproducirGlobo === 'function') {
                                window._reproducirGlobo(st.url_resolved, st.name, ciudad, btnPlay);
                            } else {
                                window._audGlobo.src = st.url_resolved; window._audGlobo.play().catch(() => { });
                                window.estacionActualData = { nombre: st.name, url: st.url_resolved, lugar: ciudad };
                                const elNombre = document.getElementById('rep-nombre'); const elLugar = document.getElementById('rep-lugar'); const elBtn = document.getElementById('rep-playpause');
                                if (elNombre) elNombre.textContent = st.name; if (elLugar) elLugar.textContent = ciudad; if (elBtn) elBtn.innerHTML = '<i class="fas fa-pause"></i>';

                                // --- REGISTRO DIRECTO A TU BASE DE DATOS (HISTORIAL BÚSQUEDA) ---
                                fetch('backend/historial.php?accion=registrar', { credentials: 'include',
                                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ nombre: st.name, streamUrl: st.url_resolved, lugar: ciudad })
                                }).catch(() => { });
                            }
                            btnPlay.innerHTML = '<i class="fas fa-pause"></i>'; btnPlay.style.background = '#1cf00c';
                        }
                        ocultarResultados(); inputBusqueda.value = st.name; btnLimpiar.style.display = 'block';
                    };

                    btnPlay.addEventListener('click', e => { e.stopPropagation(); accionReproducir(); });
                    item.addEventListener('click', accionReproducir);
                    cajaBusqueda.appendChild(item);
                });
            }

            const PAISES = { "mexico": "MX", "estados unidos": "US", "canada": "CA", "argentina": "AR", "brasil": "BR", "colombia": "CO", "chile": "CL", "peru": "PE", "españa": "ES", "francia": "FR", "alemania": "DE", "italia": "IT", "reino unido": "GB", "japon": "JP" };
            async function buscar(query) {
                if (controladorBusqueda) controladorBusqueda.abort();
                controladorBusqueda = new AbortController();
                const sig = controladorBusqueda.signal;
                const queryNorm = query.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                mostrarCarga();
                try {
                    const enc = encodeURIComponent(query.trim()); const encN = encodeURIComponent(queryNorm); const base = `limit=20&hidebroken=true&order=votes&reverse=true`;
                    const claveEncontrada = Object.keys(PAISES).find(p => queryNorm === p || queryNorm.includes(p));
                    const codigoPais = claveEncontrada ? PAISES[claveEncontrada] : null;
                    const urls = [`${RADIO_API}/stations/search?name=${enc}&${base}`, `${RADIO_API}/stations/bystate/${enc}?${base}`, `${RADIO_API}/stations/bystate/${encN}?${base}`, `${RADIO_API}/stations/bycountry/${enc}?${base}`, `${RADIO_API}/stations/bycountry/${encN}?${base}`];
                    if (codigoPais) urls.unshift(`${RADIO_API}/stations/bycountrycodeexact/${codigoPais}?${base}`);
                    const respuestas = await Promise.allSettled(urls.map(u => fetch(u, { signal: sig }).then(r => r.json()).catch(() => [])));
                    const vistos = new Set();
                    const combinados = respuestas.flatMap(r => r.status === 'fulfilled' ? (Array.isArray(r.value) ? r.value : []) : []).filter(st => { if (!st || !st.stationuuid || vistos.has(st.stationuuid)) return false; vistos.add(st.stationuuid); return true; });
                    renderizarResultados(combinados);
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        cajaBusqueda.innerHTML = `<div style="padding:16px; text-align:center; color:#ff6b6b; font-size:13px;"><i class="fas fa-triangle-exclamation" style="margin-right:6px;"></i>Error al buscar. Intenta de nuevo.</div>`;
                        iconoBusq.className = 'fas fa-magnifying-glass'; iconoBusq.style.color = '';
                    }
                }
            }

            inputBusqueda.addEventListener('input', function () {
                const q = this.value.trim(); btnLimpiar.style.display = q ? 'block' : 'none'; clearTimeout(timerBusqueda);
                if (!q) { ocultarResultados(); return; } if (q.length < 2) return; timerBusqueda = setTimeout(() => buscar(q), 400);
            });
            inputBusqueda.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { clearTimeout(timerBusqueda); const q = this.value.trim(); if (q.length >= 2) buscar(q); }
                if (e.key === 'Escape') { ocultarResultados(); this.blur(); }
            });
            btnLimpiar.addEventListener('click', () => { inputBusqueda.value = ''; btnLimpiar.style.display = 'none'; ocultarResultados(); inputBusqueda.focus(); });
            document.addEventListener('click', e => {
                const wrapper = document.querySelector('.barra-busqueda-wrapper');
                const modal = document.getElementById('customModal');
                if (wrapper && !wrapper.contains(e.target) && (!modal || !modal.contains(e.target))) ocultarResultados();
            });
        })();

        document.querySelectorAll('a[href="index.html"].btn-cerrar').forEach(a => {
            a.addEventListener('click', function (e) {
                e.preventDefault(); sessionStorage.removeItem('at_logged'); sessionStorage.removeItem('at_user'); window.location.href = 'index.html';
            });
        });

        // Botones de cierre de paneles (móvil)
        const cerrarHistorialBtn = document.getElementById('cerrarHistorial');
        if (cerrarHistorialBtn) cerrarHistorialBtn.addEventListener('click', () => document.getElementById('panelHistorial').classList.remove('abierto'));
        const cerrarAmigosBtn = document.getElementById('cerrarAmigos');
        if (cerrarAmigosBtn) cerrarAmigosBtn.addEventListener('click', () => document.getElementById('panelAmigos').classList.remove('abierto'));

        // ── Medir altura real del header y aplicarla a paneles e iconos laterales ──
        function aplicarAlturaHeader() {
            const hdr = document.querySelector('header');
            if (!hdr) return;
            const h = hdr.getBoundingClientRect().height;
            document.documentElement.style.setProperty('--header-h', h + 'px');
            // Ajustar iconos laterales: centrarlos entre header y reproductor
            const iconosLateral = document.querySelector('.iconos-lateral');
            if (iconosLateral && window.innerWidth <= 768) {
                const reproductorH = document.querySelector('.reproductor')?.getBoundingClientRect().height || 90;
                const available = window.innerHeight - h - reproductorH;
                const top = h + (available / 2);
                iconosLateral.style.top = top + 'px';
                iconosLateral.style.transform = 'translateY(-50%)';
                iconosLateral.style.bottom = 'auto';
            }
        }
        // Ejecutar al cargar y en cada resize/orientación
        window.addEventListener('load', aplicarAlturaHeader);
        window.addEventListener('resize', aplicarAlturaHeader);
        // También ejecutar inmediatamente por si el DOM ya está listo
        aplicarAlturaHeader();
        // Segundo intento con RAF por si el header aún no tenía dimensiones
        requestAnimationFrame(() => requestAnimationFrame(aplicarAlturaHeader));
    </script>
    <script>
        // SCRIPT PARA CERRAR PANELES AL DAR CLIC FUERA
        document.addEventListener('click', function (e) {

            // 1. Panel Historial
            const pHist = document.getElementById('panelHistorial');
            const btnHist = document.querySelector('a[href="historial.html"]');

            if (pHist && pHist.classList.contains('abierto')) {
                // Si el clic no fue dentro del panel, ni en el botón que lo abre
                if (!pHist.contains(e.target) && (!btnHist || !btnHist.contains(e.target))) {
                    pHist.classList.remove('abierto');
                }
            }

            // 2. Panel Emisoras (El del Globo)
            const pEmi = document.getElementById('panel-emisoras');
            const canvasGlobo = document.getElementById('globo-canvas');

            if (pEmi && pEmi.classList.contains('abierto')) {
                const modal = document.getElementById('customModal');
                if (!pEmi.contains(e.target) && (!canvasGlobo || !canvasGlobo.contains(e.target)) && (!modal || !modal.contains(e.target))) {
                    pEmi.classList.remove('abierto');
                    // ← Sin pausar el audio
                }

            }

            // 3. Panel Amigos
            const pAmi = document.getElementById('panelAmigos');
            const btnAmi = document.querySelector('.icono-btn[title="Amigos"]');

            if (pAmi && pAmi.classList.contains('abierto')) {
                if (!pAmi.contains(e.target) && (!btnAmi || !btnAmi.contains(e.target))) {
                    pAmi.classList.remove('abierto');
                }
            }
        });
    </script>

    <script>
        // ── PERSISTENCIA DE AUDIO ENTRE PÁGINAS ──────────────────────────────
        // Guardar estado siempre al salir (esté pausado o no)
        window.addEventListener('beforeunload', () => {
            const audActivo = window._audGlobo;
            if (!audActivo) return;
            const url    = audActivo.src;
            const nombre = document.getElementById('rep-nombre')?.textContent || '';
            const lugar  = document.getElementById('rep-lugar')?.textContent  || '';
            const vol    = audActivo.volume;
            const paused = audActivo.paused;
            if (url && url !== window.location.href && nombre && nombre !== 'Selecciona una emisora') {
                sessionStorage.setItem('at_stream_url',    url);
                sessionStorage.setItem('at_stream_nombre', nombre);
                sessionStorage.setItem('at_stream_lugar',  lugar);
                sessionStorage.setItem('at_stream_vol',    vol);
                sessionStorage.setItem('at_stream_paused', paused ? '1' : '0');
            }
        });

        // Al cargar: reanudar si venía de otra página
        window.addEventListener('load', () => {
            const url    = sessionStorage.getItem('at_stream_url');
            const nombre = sessionStorage.getItem('at_stream_nombre');
            const lugar  = sessionStorage.getItem('at_stream_lugar') || '';
            const vol    = parseFloat(sessionStorage.getItem('at_stream_vol') || '0.7');
            const paused = sessionStorage.getItem('at_stream_paused') === '1';

            if (!url || !nombre) return;

            const intentar = setInterval(() => {
                if (typeof window._reproducirGlobo === 'function' && window._audGlobo) {
                    clearInterval(intentar);
                    window._audGlobo.volume = vol;
                    const slider = document.getElementById('rep-volumen');
                    if (slider) slider.value = Math.round(vol * 100);

                    const elNombre = document.getElementById('rep-nombre');
                    const elLugar  = document.getElementById('rep-lugar');
                    if (elNombre) elNombre.textContent = nombre;
                    if (elLugar)  elLugar.textContent  = lugar;
                    window.estacionActualData = { nombre, url, lugar };

                    if (!paused) {
                        setTimeout(() => {
                            window._reproducirGlobo(url, nombre, lugar, document.getElementById('rep-playpause'));
                        }, 400);
                    } else {
                        window._audGlobo.src = url;
                        const btnPlay = document.getElementById('rep-playpause');
                        if (btnPlay) btnPlay.innerHTML = '<i class="fas fa-play"></i>';
                    }
                }
            }, 100);
        });
    </script>

    <script>
        // ── SOPORTE ENTER PARA ELEMENTOS INTERACTIVOS ──────────────────────
        document.getElementById('inputCodigoJam').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !document.getElementById('btnUnirse').disabled)
                document.getElementById('btnUnirse').click();
        });

        document.getElementById('inputBuscarAmigo').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                const primer = document.querySelector('.btn-agregar-amigo');
                if (primer) primer.click();
            }
        });

        const observerBusqueda = new MutationObserver(() => {
            document.querySelectorAll('#resultadosBusqueda > div').forEach(item => {
                if (!item.hasAttribute('tabindex')) {
                    item.setAttribute('tabindex', '0');
                    item.setAttribute('role', 'button');
                    item.addEventListener('keydown', e => {
                        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); item.click(); }
                    });
                }
            });
        });
        observerBusqueda.observe(document.getElementById('resultadosBusqueda'), { childList: true });

        const observerAmigos = new MutationObserver(() => {
            document.querySelectorAll('#resultadosBusquedaAmigos > div').forEach(item => {
                if (!item.hasAttribute('tabindex')) {
                    item.setAttribute('tabindex', '0');
                    item.addEventListener('keydown', e => {
                        if (e.key === 'Enter') { const btn = item.querySelector('.btn-agregar-amigo'); if (btn) btn.click(); }
                    });
                }
            });
        });
        observerAmigos.observe(document.getElementById('resultadosBusquedaAmigos'), { childList: true });

        const observerHistorial = new MutationObserver(() => {
            document.querySelectorAll('#listaHistorialItems .lista-item').forEach(item => {
                if (!item.hasAttribute('tabindex')) {
                    item.setAttribute('tabindex', '0');
                    item.setAttribute('role', 'button');
                    item.addEventListener('keydown', e => {
                        if (e.key === 'Enter') { const btn = item.querySelector('.play-historial'); if (btn) btn.click(); }
                    });
                }
            });
        });
        observerHistorial.observe(document.getElementById('listaHistorialItems'), { childList: true, subtree: true });

        const observerListaAmigos = new MutationObserver(() => {
            document.querySelectorAll('#listaAmigos .amigo-item').forEach(item => {
                if (!item.hasAttribute('tabindex')) {
                    item.setAttribute('tabindex', '0');
                    item.addEventListener('keydown', e => {
                        if (e.key === 'Enter') { const btn = item.querySelector('.btn-invitar-jam'); if (btn) btn.click(); }
                    });
                }
            });
        });
        observerListaAmigos.observe(document.getElementById('listaAmigos'), { childList: true });
    </script>
</body>
