<!DOCTYPE html>
<html lang="es">

<head>
    <script>
        if (!sessionStorage.getItem('at_logged')) {
            window.location.replace('inicio.html');
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos - Audio Traveler</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="no-reproductor">
    <div id="universe"></div>

    <header>
        <nav>
            <div class="logo">
                <a href="index.html"><h1>Audio Traveler</h1></a>
            </div>
            <div class="nav-links">
                <a href="usuarioLoggeado.html" class="btn-nav">Regresar</a>
                <a href="index.html" class="btn-cerrar">Cerrar Sesión</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="lista-seccion">
            <h2 class="lista-titulo">Mis Favoritos</h2>
            <div id="contenedor-favoritos"></div>
        </section>

        <div class="fav-reproductor" id="favReproductor" style="display:none;">
            <div class="fav-rep-info">
                <i class="fas fa-radio" style="color:#1cf00c;margin-right:10px;"></i>
                <span id="favNombre">-</span>
            </div>
            <div class="fav-rep-controles">
                <button class="control-btn" id="favPlayPause">
                    <i class="fas fa-pause"></i>
                </button>
                <button class="control-btn" id="favStop">
                    <i class="fas fa-stop"></i>
                </button>
                <div class="reproductor-volumen">
                    <i class="fas fa-volume-high"></i>
                    <input type="range" min="0" max="100" value="70" id="favVolumen">
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-inner">
            <p class="footer-copy">&copy; 2026 Audio Traveler. Todos los derechos reservados.</p>
            <div class="footer-team">
                <span class="footer-team-label">Equipo:</span>
                <div class="footer-team-names">
                    <span>Karla Yaneth Cruz Sandoval</span>
                    <span>Arturo Huerta Maldonado</span>
                    <span>Josue Francisco Hernández Iturbide</span>
                    <span>Abisai Tapia Ulloa</span>
                    <span>Gael Askary Razo Montañez</span>
                </div>
            </div>
        </div>
    </footer>

    <script src="estrellas.js"></script>
    <script>
        const aud = window._audGlobal || new Audio();
        window._audGlobal = aud;
        let audioActivo = null;

        // Iniciar carga al abrir
        window.onload = cargarFavoritos;

        // 1. CARGAR FAVORITOS DESDE EL BACKEND
        async function cargarFavoritos() {
            const contenedor = document.getElementById('contenedor-favoritos');
            contenedor.innerHTML = '<p style="color:white; text-align:center;">Cargando tus estaciones...</p>';

            try {
                const res = await fetch('backend/favoritos.php?accion=cargar');
                const data = await res.json();

                if (!data.ok) throw new Error(data.mensaje);

                contenedor.innerHTML = ''; 

                if (data.favoritos.length === 0) {
                    contenedor.innerHTML = '<p style="color:#7a6090; text-align:center;">No tienes estaciones guardadas aún.</p>';
                    return;
                }

                data.favoritos.forEach(fav => {
                    const item = document.createElement('div');
                    item.className = 'lista-item';
                    item.innerHTML = `
                        <div class="lista-info">
                            <i class="fas fa-radio"></i>
                            <div>
                                <h3>${fav.Nombre}</h3>
                                <p>${fav.Ciudad}, ${fav.Pais} | ${fav.Genero || 'Radio'}</p>
                            </div>
                        </div>
                        <div class="lista-acciones">
                            <button class="control-btn btn-play-fav" 
                                    data-url="${fav.Stream_url}" 
                                    data-nombre="${fav.Nombre}" 
                                    data-lugar="${fav.Ciudad}, ${fav.Pais}">
                                <i class="fas fa-play"></i>
                            </button>
                            <button class="control-btn btn-eliminar-real" data-id="${fav.IdFavorito}">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;
                    contenedor.appendChild(item);
                });

                asignarEventos();
            } catch (err) {
                contenedor.innerHTML = `<p style="color:#ff4444; text-align:center;">Error: ${err.message}</p>`;
            }
        }

        // 2. ASIGNAR EVENTOS A BOTONES DINÁMICOS
        function asignarEventos() {
            document.querySelectorAll('.btn-play-fav').forEach(btn => {
                btn.addEventListener('click', async function() {
                    const urlOriginal = this.dataset.url;
                    const url = (location.protocol === 'https:' && urlOriginal && urlOriginal.startsWith('http://')) 
                                ? urlOriginal.replace('http://', 'https://') 
                                : urlOriginal;
                                
                    const nombre = this.dataset.nombre;
                    const lugarTexto = this.dataset.lugar;

                    if (audioActivo === url) {
                        if (aud.paused) {
                            aud.play();
                            this.innerHTML = '<i class="fas fa-pause"></i>';
                            document.getElementById('favPlayPause').innerHTML = '<i class="fas fa-pause"></i>';
                        } else {
                            aud.pause();
                            this.innerHTML = '<i class="fas fa-play"></i>';
                            document.getElementById('favPlayPause').innerHTML = '<i class="fas fa-play"></i>';
                        }
                        return;
                    }

                    document.querySelectorAll('.btn-play-fav').forEach(b => b.innerHTML = '<i class="fas fa-play"></i>');
                    aud.src = url;
                    this.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

                    try {
                        const resHist = await fetch('backend/historial.php?accion=registrar', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                nombre: nombre,  
                                streamUrl: url,
                                lugar: lugarTexto 
                            })
                        });
                        const dataHist = await resHist.json();
                        console.log("Respuesta del historial:", dataHist);
                    } catch(err) {
                        console.error("Error enviando al historial:", err);
                    }

                    aud.play().then(() => {
                        audioActivo = url;
                        this.innerHTML = '<i class="fas fa-pause"></i>';
                        document.getElementById('favNombre').textContent = nombre;
                        document.getElementById('favReproductor').style.display = 'flex';
                        document.getElementById('favPlayPause').innerHTML = '<i class="fas fa-pause"></i>';

                        // Persistir estado en sessionStorage
                        sessionStorage.setItem('at_stream_url', url);
                        sessionStorage.setItem('at_stream_nombre', nombre);
                        sessionStorage.setItem('at_stream_lugar', lugarTexto);
                        sessionStorage.setItem('at_stream_paused', 'false');
                    }).catch(() => {
                        this.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
                        setTimeout(() => this.innerHTML = '<i class="fas fa-play"></i>', 3000);
                    });
                });
            });

            document.querySelectorAll('.btn-eliminar-real').forEach(btn => {
                btn.addEventListener('click', async function() {
                    const id = this.dataset.id;
                    if (confirm('¿Eliminar de favoritos?')) {
                        try {
                            const res = await fetch('backend/favoritos.php?accion=eliminar', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ idFavorito: id })
                            });
                            const r = await res.json();
                            if (r.ok) cargarFavoritos();
                        } catch (e) { alert("Error al eliminar"); }
                    }
                });
            });
        }

        // 3. REPRODUCTOR INFERIOR
        document.getElementById('favVolumen').addEventListener('input', function() { aud.volume = this.value / 100; });

        document.getElementById('favPlayPause').addEventListener('click', () => {
            if (aud.paused) {
                aud.play().catch(() => {});
                document.getElementById('favPlayPause').innerHTML = '<i class="fas fa-pause"></i>';
            } else {
                aud.pause();
                document.getElementById('favPlayPause').innerHTML = '<i class="fas fa-play"></i>';
            }
            actualizarBotonesEnLista();
        });

        document.getElementById('favStop').addEventListener('click', () => {
            aud.pause(); aud.src = ''; audioActivo = null;
            document.getElementById('favReproductor').style.display = 'none';
            actualizarBotonesEnLista();
        });

        function actualizarBotonesEnLista() {
            document.querySelectorAll('.btn-play-fav').forEach(btn => {
                if (btn.dataset.url === audioActivo) {
                    btn.innerHTML = aud.paused ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>';
                } else {
                    btn.innerHTML = '<i class="fas fa-play"></i>';
                }
            });
        }
    </script>

    <style>
        .fav-reproductor {
            position: fixed;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(22, 0, 40, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(28, 240, 12, 0.3);
            border-radius: 50px;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 200;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.4);
            width: clamp(280px, 70vw, 520px);
        }
        .fav-rep-info {
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            color: #f0e6ff;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>

    <script>
        document.querySelectorAll('a[href="index.html"].btn-cerrar').forEach(a => {
            a.addEventListener('click', function(e) {
                e.preventDefault();
                sessionStorage.clear();
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
