<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Audio Traveler</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="universe"></div>

    <header>
        <nav>
            <div class="logo">
                <a href="index.html">
                    <h1>Audio Traveler</h1>
                </a>
            </div>
            <div class="nav-links">
                <a href="index.html" class="btn-nav">Inicio</a>
                <a href="registro.html" class="btn-nav">Registrarse</a>
                <a href="inicio.html" class="btn-cerrar">Iniciar Sesión</a>
            </div>
        </nav>
    </header>

    <main class="main-login">
        <section class="login-layout">
            <div class="registro-texto">
                <h2>Bienvenido de vuelta</h2>
                <p>Inicia sesión y sigue explorando radios de todo el mundo.</p>
            </div>
            <div class="form-container">
                <div class="form-grupo">
                    <label>Correo electrónico</label>
                    <input type="email" placeholder="correo@ejemplo.com">
                </div>
                <div class="form-grupo">
                    <label>Contraseña</label>
                    <input type="password" placeholder="••••••••">
                </div>
                <button class="btn">Iniciar Sesión</button>
                <p class="form-link">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Audio Traveler. Todos los derechos reservados.</p>
    </footer>

    <script src="estrellas.js"></script>

</body>

</html>
