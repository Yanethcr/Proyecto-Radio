<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos - Audio Traveler</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div id="universe"></div>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">
                    <h1>Audio Traveler</h1>
                </a>
            </div>
            <div class="nav-links">
                <a href="usuarioLoggeado.html" class="btn-nav">Regresar</a>
                <a href="index.html" class="btn-cerrar">Cerrar Sesión</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="lista-seccion">
            <h2 class="lista-titulo">Mis Favoritos</h2>

            <div class="lista-item">
                <div class="lista-info">
                    <i class="fas fa-radio"></i>
                    <div>
                        <h3>Super 98.1 FM</h3>
                        <p>Cuernavaca, México</p>
                    </div>
                </div>
                <div class="lista-acciones">
                    <button class="control-btn"><i class="fas fa-play"></i></button>
                    <button class="control-btn"><i class="fas fa-heart" style="color:#1cf00c"></i></button>
                    <button class="control-btn btn-eliminar"><i class="fas fa-trash"></i></button>
                </div>
            </div>

            <div class="lista-item">
                <div class="lista-info">
                    <i class="fas fa-radio"></i>
                    <div>
                        <h3>Radio Fórmula</h3>
                        <p>Ciudad de México, México</p>
                    </div>
                </div>
                <div class="lista-acciones">
                    <button class="control-btn"><i class="fas fa-play"></i></button>
                    <button class="control-btn"><i class="fas fa-heart" style="color:#1cf00c"></i></button>
                    <button class="control-btn btn-eliminar"><i class="fas fa-trash"></i></button>
                </div>
            </div>

            <div class="lista-item">
                <div class="lista-info">
                    <i class="fas fa-radio"></i>
                    <div>
                        <h3>BBC Radio 1</h3>
                        <p>Londres, Reino Unido</p>
                    </div>
                </div>
                <div class="lista-acciones">
                    <button class="control-btn"><i class="fas fa-play"></i></button>
                    <button class="control-btn"><i class="fas fa-heart" style="color:#1cf00c"></i></button>
                    <button class="control-btn btn-eliminar"><i class="fas fa-trash"></i></button>
                </div>
            </div>

        </section>
    </main>
    <script src="estrellas.js"></script>


    <footer>
        <p>&copy; 2026 Audio Traveler. Todos los derechos reservados.</p>
    </footer>

    <script>
        document.querySelectorAll('.btn-eliminar').forEach(btn => {
            btn.addEventListener('click', function () {
                const item = this.closest('.lista-item');
                item.style.transition = 'opacity 0.3s';
                item.style.opacity = '0';
                setTimeout(() => item.remove(), 300);
            });
        });
    </script>

</body>

</body>

</html>
