<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jam - Audio Traveler</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="jam-body">
    <div id="universe"></div>

    <header>
        <nav>
            <div class="logo">
                <a href="index.html">
                    <h1>Audio Traveler</h1>
                </a>
            </div>
            <div class="nav-links">
                <a href="usuarioLoggeado.html" class="btn-nav">Inicio</a>
                <a href="index.html" class="btn-cerrar">Cerrar Sesión</a>
            </div>
        </nav>
    </header>

    <main class="jam-main">

        <h2 class="jam-titulo">Jam de Usuario..</h2>

        <div class="jam-botones">
            <button class="btn-jam" id="btnInvitar">Invitar</button>
            <a href="usuarioLoggeado.html">
                <button class="btn-jam">Terminar</button>
            </a>
        </div>

        <div class="jam-reproductor">
            <div class="jam-info">
                <p class="jam-escuchando">Estas escuchando:</p>
                <h3 class="jam-estacion">Super 98.1 FM Cuernavaca</h3>
                <p class="jam-lugar">Cuernavaca, México</p>
            </div>
            <div class="jam-controles">
                <button class="control-btn"><i class="fas fa-backward-step"></i></button>
                <button class="control-btn"><i class="fas fa-stop"></i></button>
                <button class="control-btn"><i class="fas fa-forward-step"></i></button>
            </div>
        </div>

        <div class="barra-busqueda-jam">
            <i class="fas fa-magnifying-glass"></i>
            <input type="text" placeholder="Buscar ciudad, país o estación">
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Audio Traveler. Todos los derechos reservados.</p>
    </footer>

    <div class="panel-amigos" id="panelAmigos">
        <div class="panel-header">
            <h3>Amigos</h3>
            <button class="btn-cerrar-panel" id="cerrarAmigos">
                <i class="fas fa-xmark"></i>
            </button>
        </div>

        <div class="codigo-jam">
            <p>Código de sala:</p>
            <div class="codigo-contenedor">
                <span id="codigoSala">------</span>
                <button class="btn-copiar" id="btnCopiar">
                    <i class="fas fa-copy"></i>
                </button>
            </div>
            <button class="btn-generar" id="btnGenerar">Generar código</button>
        </div>

        <div class="buscador-amigos">
            <i class="fas fa-magnifying-glass"></i>
            <input type="text" id="inputBuscarAmigo" placeholder="Buscar por usuario...">
        </div>

        <div class="lista-amigos">
            <div class="amigo-item">
                <div class="lista-info">
                    <i class="fas fa-user-circle"></i>
                    <div>
                        <h3>@karla_cruz</h3>
                        <p>En línea</p>
                    </div>
                </div>
                <div class="lista-acciones">
                    <button class="control-btn btn-invitar-jam"><i class="fas fa-headphones"></i></button>
                    <button class="control-btn btn-eliminar"><i class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="amigo-item">
                <div class="lista-info">
                    <i class="fas fa-user-circle"></i>
                    <div>
                        <h3>@arturo_hm</h3>
                        <p>Escuchando radio</p>
                    </div>
                </div>
                <div class="lista-acciones">
                    <button class="control-btn btn-invitar-jam"><i class="fas fa-headphones"></i></button>
                    <button class="control-btn btn-eliminar"><i class="fas fa-trash"></i></button>
                </div>
            </div>
            <div class="amigo-item">
                <div class="lista-info">
                    <i class="fas fa-user-circle"></i>
                    <div>
                        <h3>@gael_razo</h3>
                        <p>Desconectado</p>
                    </div>
                </div>
                <div class="lista-acciones">
                    <button class="control-btn btn-invitar-jam"><i class="fas fa-headphones"></i></button>
                    <button class="control-btn btn-eliminar"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('btnInvitar').addEventListener('click', function () {
            document.getElementById('panelAmigos').classList.toggle('abierto');
        });

        document.getElementById('cerrarAmigos').addEventListener('click', function () {
            document.getElementById('panelAmigos').classList.remove('abierto');
        });

        document.getElementById('inputBuscarAmigo').addEventListener('input', function () {
            const termino = this.value.toLowerCase();
            document.querySelectorAll('.amigo-item').forEach(item => {
                const nombre = item.querySelector('h3').textContent.toLowerCase();
                item.style.display = nombre.includes(termino) ? 'flex' : 'none';
            });
        });

        document.querySelectorAll('.btn-eliminar').forEach(btn => {
            btn.addEventListener('click', function () {
                const item = this.closest('.amigo-item');
                item.style.transition = 'opacity 0.3s';
                item.style.opacity = '0';
                setTimeout(() => item.remove(), 300);
            });
        });

        document.getElementById('btnGenerar').addEventListener('click', function () {
            const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let codigo = '';
            for (let i = 0; i < 6; i++) {
                codigo += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            }
            document.getElementById('codigoSala').textContent = codigo;
        });

        document.getElementById('btnCopiar').addEventListener('click', function () {
            const codigo = document.getElementById('codigoSala').textContent;
            if (codigo !== '------') {
                navigator.clipboard.writeText(codigo);
                this.innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => {
                    this.innerHTML = '<i class="fas fa-copy"></i>';
                }, 2000);
            }
        });
    </script>

</body>

</html>
